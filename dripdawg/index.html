<style>
:root{--bg:#0b0b0c;--card:#151517;--line:#26262a;--tx:#ededee;--mut:#8b8b92;--acc:#c6ff3d;--bad:#ff5c5c;--warn:#ffb020;--ok:#4cd98a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:30px;height:30px;display:block}
.logo{font-weight:900;letter-spacing:.14em;font-size:18px}
.logo b{color:var(--acc)}
.sub{color:var(--mut);font-size:12px}
main{padding:8px 16px 110px;max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#101012;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:13px 0 11px;font:600 11px inherit;letter-spacing:.02em}
.btn:disabled{opacity:.45}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.dot{width:22px;height:22px;border-radius:50%;border:1px solid #ffffff30;flex:none}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--mut);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:#1b1b1e;border:1px solid var(--line);color:var(--tx);padding:7px 12px;border-radius:99px;font-size:13px}
.chip.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
.btn{background:var(--acc);color:#000;border:0;border-radius:12px;padding:13px 16px;font-weight:800;font-size:15px;width:100%}
.btn.ghost{background:#1b1b1e;color:var(--tx);border:1px solid var(--line);font-weight:600}
.btn.sm{width:auto;padding:8px 12px;font-size:13px}
.btn.danger{background:#2a1414;color:var(--bad);border:1px solid #4a2020}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
h3{margin:18px 0 6px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.slot .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.slot{cursor:pointer}
.warn{padding:9px 12px;border-radius:10px;margin:6px 0;font-size:13.5px}
.warn.bad{background:#2a1414;color:#ff9a9a;border:1px solid #4a2020}
.warn.warn{background:#2a2110;color:#ffd27a;border:1px solid #4a3a16}
.warn.ok{background:#102418;color:#7be8a8;border:1px solid #1c4030}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.tag.bad{color:var(--bad);border-color:#4a2020}
.tag.ok{color:var(--ok);border-color:#1c4030}
.tag.wish{color:var(--warn);border-color:#4a3a16}
input[type=text],input[type=number],input[type=date],select{width:100%;background:#1b1b1e;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
input[type=color]{width:56px;height:40px;border:0;background:none;padding:0}
label.f{display:block;margin:10px 0 4px;color:var(--mut);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#sheet{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end}
#sheet.on{display:flex}
.sh{background:#121214;border-top:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;margin:0 auto;max-height:84vh;overflow:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
.li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #1e1e22}
.bar{height:8px;background:#1b1b1e;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:30;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1}
.big{font-size:26px;font-weight:800}
.score{font-size:34px;font-weight:900;color:var(--acc);line-height:1}
.score small{font-size:14px;color:var(--mut);font-weight:600}
.why{margin:8px 0 0;padding:0;list-style:none;font-size:13.5px}
.why li{padding:3px 0 3px 18px;position:relative}
.why li:before{content:"+";position:absolute;left:2px;color:var(--ok);font-weight:900}
.why li.n:before{content:"\2013";color:var(--bad)}
.why li.n{color:#ff9a9a}
</style>
</head>
<body>

<script>
(function(){
const KEY='dripdawg.v1';
const CATS=[['top','Top'],['layer','Layer'],['bottom','Bottom'],['shoes','Shoes']];
const VIBES=['casual','smart','beach'];
const KINDS={top:['tee','henley','fullsleeve','shirt','polo','jersey','beach'],layer:['hoodie','jacket'],bottom:['skinny','straight','baggy'],shoes:['sneaker','loafer']};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}

/* ---------- seed wardrobe ----------
   [name, cat, colour, vibes(C/S/B), role(n=neutral e=earth a=accent), kind, heavy, pattern, owned] */
const SEEDDEF=[
 ['Dark blue henley','top','#1f2f5a','C','n','henley',0,0],
 ['Black ribbed henley','top','#141414','C','n','henley',0,0],
 ['Grey/navy raglan tee','top','#8a8f98','C','n','tee',0,0],
 ['White H&M tee','top','#f2f2f2','C','n','tee',0,0],
 ['Black H&M tee','top','#111111','C','n','tee',0,0],
 ['Grey H&M tee','top','#9a9a9a','C','n','tee',0,0],
 ['Dark grey H&M tee','top','#3a3a3c','C','n','tee',0,0],
 ['Green striped full sleeve (high gsm)','top','#2f6b3f','C','e','fullsleeve',1,1],
 ['Cream full sleeve, mustard patch','top','#eadfc4','C','e','fullsleeve',1,0],
 ['White/sage striped wool','top','#b7c4a5','C','e','fullsleeve',1,1],
 ['LFC jersey','top','#c8102e','C','a','jersey',0,1],
 ['Chelsea jersey','top','#034694','C','a','jersey',0,1],
 ['Brasil jersey','top','#f9d71c','C','a','jersey',0,1],
 ['Dark blue shirt','top','#1b2a4e','S','n','shirt',0,0],
 ['White shirt (polyester)','top','#f5f5f5','S','n','shirt',0,0],
 ['White linen shirt','top','#efece4','S','n','shirt',0,0],
 ['Pink shirt','top','#e8a0b4','S','a','shirt',0,0],
 ['Dark grey shirt','top','#3d3d40','S','n','shirt',0,0],
 ['Coffee brown shirt','top','#5b3a29','S','e','shirt',0,0],
 ['Maroon shirt','top','#6d1a2a','S','e','shirt',0,0],
 ['Black Chinese-collar shirt','top','#101010','S','n','shirt',0,0],
 ['Black tissue shirt','top','#161616','S','n','shirt',0,0],
 ['Olive corduroy shirt','top','#6b6b2f','S','e','shirt',0,0],
 ['Dusty pink linen shirt','top','#c99a9f','S','e','shirt',0,0],
 ['Blue/white check (Louis Philippe)','top','#6f93c9','S','n','shirt',0,1],
 ['Dark green polo','top','#1f4d2e','CS','e','polo',0,0],
 ['Black polo','top','#121212','CS','n','polo',0,0],
 ['Dark blue polo','top','#1c2b52','CS','n','polo',0,0],
 ['White polo','top','#f4f4f4','CS','n','polo',0,0],
 ['Red polo','top','#b3202a','CS','a','polo',0,0],
 ['Leopard print shirt','top','#c99a3b','B','a','beach',0,1],
 ['Blue/white birds print shirt','top','#3d6fb0','B','a','beach',0,1],
 ['Grey hoodie','layer','#8c8c8f','C','n','hoodie',1,0],
 ['Orange hoodie','layer','#e8762b','C','a','hoodie',1,0],
 ['Dark blue jacket','layer','#1c2a48','CS','n','jacket',0,0],
 ['Dark blue skinny jeans','bottom','#1c2b4a','CSB','n','skinny',0,0],
 ['Grey skinny jeans','bottom','#6b6b6e','CSB','n','skinny',0,0],
 ['Black skinny jeans #1','bottom','#1a1a1a','CSB','n','skinny',0,0],
 ['Black skinny jeans #2','bottom','#1a1a1a','CSB','n','skinny',0,0],
 ['Light wash baggy jeans','bottom','#8fb0d4','CB','n','baggy',0,0],
 ['Puma Dmash 3.0 (black/white)','shoes','#1a1a1a','CSB','n','sneaker',0,0],
 ['Puma Motorsport red high','shoes','#c8102e','CB','a','sneaker',0,0],
 ['Puma Hampton (grey/green mesh)','shoes','#7d8a80','CSB','e','sneaker',0,0],
 ['Samba (green stripe)','shoes','#e8e4d8','CSB','n','sneaker',0,0],
 ['Nike Vulc SB white','shoes','#f0f0f0','CSB','n','sneaker',0,0,0],
 ['Black formal loafer','shoes','#111111','S','n','loafer',0,0]
];
const VC={C:'casual',S:'smart',B:'beach'};
const RC={n:'neutral',e:'earth',a:'accent'};
const defToItem=r=>({id:uid(),name:r[0],cat:r[1],color:r[2],vibes:r[3].split('').map(c=>VC[c]),role:RC[r[4]],kind:r[5],heavy:!!r[6],pat:!!r[7],owned:r[8]!==0});
const SEEDX={};SEEDDEF.forEach(r=>{SEEDX[r[0]]={role:RC[r[4]],kind:r[5],heavy:!!r[6],pat:!!r[7]}});
const seed=()=>SEEDDEF.map(defToItem);

/* ---------- colour helpers ---------- */
const hslCache={};
function hsl(hex){
  if(hslCache[hex])return hslCache[hex];
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;
  if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
  return hslCache[hex]={h,s,l};
}
const tone=i=>{const l=hsl(i.color).l;return l<.3?'dark':l<.62?'mid':'light'};
const fam=(a,b)=>{const x=hsl(a.color),y=hsl(b.color);let dh=Math.abs(x.h-y.h);dh=Math.min(dh,360-dh);return dh<35&&x.s>.15&&y.s>.15};
function autoRole(color,cat){
  const x=hsl(color);
  if(x.s<.2||x.l<.14||x.l>.88)return 'neutral';
  if(x.h>=200&&x.h<=260&&x.l<.45)return 'neutral';
  if(cat==='bottom')return 'neutral';
  return (x.s>.5&&x.l>.25&&x.l<.75)?'accent':'earth';
}
function enrich(i){
  if(!i.kind||!i.role){
    const m=SEEDX[i.name];
    if(m)Object.assign(i,m);
    else{i.role=autoRole(i.color,i.cat);i.kind=KINDS[i.cat][0];i.heavy=false;i.pat=false}
  }
  if(!i.vibes||!i.vibes.length)i.vibes=['casual'];
  if(i.stripe===undefined)i.stripe=/stripe/i.test(i.name);
  return i;
}
const PROFILE0={height:'',weight:'',shoulder:'',chest:'',waist:'',thigh:'',notes:'Bigger legs, lagging upper body. Narrow up top, more mass below.'};
function fix(j){
  j.taste=j.taste||{};
  j.build=j.build||'lower';
  j.profile=Object.assign({},PROFILE0,j.profile||{});
  j.items.forEach(enrich);
  return j;
}

/* ---------- state ---------- */
const DEF=()=>fix({v:3,items:seed(),logs:[],taste:{},settings:{combo:7,rest:{top:3,layer:1,bottom:2,shoes:2}}});
let S=(function(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.items&&j.logs&&j.settings)return fix(j)}catch(e){}return DEF()})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save (storage blocked)')}}
save();

const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayS=()=>ymd(new Date());
const dnum=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
const diff=(a,b)=>Math.round(dnum(a)-dnum(b));
const nice=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})};

let view='today';
const D={date:todayS(),sel:{top:null,layer:null,bottom:null,shoes:null},vibe:'any',layer:'off',temp:'warm',seen:new Set()};
const W={cat:'all',q:''};
function loadDraft(){
  const l=S.logs.find(x=>x.date===D.date);
  D.sel={top:null,layer:null,bottom:null,shoes:null};
  if(l)l.items.forEach(id=>{const it=item(id);if(it)D.sel[it.cat]=id});
  D.seen=new Set();
}
const item=id=>S.items.find(i=>i.id===id);
loadDraft();

const logsBefore=date=>S.logs.filter(l=>l.date<date).sort((a,b)=>b.date<a.date?-1:1);
function daysSince(id,date){
  for(const l of logsBefore(date)){if(l.items.includes(id))return diff(date,l.date)}
  return null;
}
function lastPairDays(a,b,date){
  if(!a||!b)return null;
  for(const l of logsBefore(date)){if(l.items.includes(a)&&l.items.includes(b))return diff(date,l.date)}
  return null;
}
function lastComboDays(ids,date){
  if(ids.length<2)return null;
  for(const l of logsBefore(date)){if(ids.every(i=>l.items.includes(i))&&l.items.length===ids.length)return diff(date,l.date)}
  return null;
}
const wornCount=id=>S.logs.filter(l=>l.items.includes(id)).length;
const lastWornAny=id=>{const l=S.logs.filter(x=>x.items.includes(id)).sort((a,b)=>b.date<a.date?-1:1)[0];return l?l.date:null};
const blocked=(it,date)=>{const d=daysSince(it.id,date);return d!==null&&d<=S.settings.rest[it.cat]};
const ago=d=>d===null?'never worn':d===0?'today':d===1?'yesterday':d+'d ago';

/* ---------- the styling brain ---------- */
const pairKeys=ps=>{const k=[];for(let a=0;a<ps.length;a++)for(let b=a+1;b<ps.length;b++)k.push([ps[a].id,ps[b].id].sort().join('|'));return k};
const BASE=['tee','henley','shirt','polo','jersey'];
function scoreFit(f){
  const {top,layer,bottom,shoes}=f;
  const R=[],H=[];let raw=0;
  const add=(v,m)=>{raw+=v;R.push({v,m})};
  const ps=[top,layer,bottom,shoes].filter(Boolean);
  const collar=top.kind==='shirt'||top.kind==='polo';
  const tt=tone(top),bt=tone(bottom);

  /* hard rules: these never look intentional */
  if(shoes.kind==='loafer'){
    if(!collar)H.push('Loafers only work with a shirt or polo');
    if(bottom.kind==='baggy')H.push('Loafers with baggy jeans look off');
    if(layer&&layer.kind==='hoodie')H.push('Hoodie with loafers clashes');
  }
  if(layer&&top.kind==='beach')H.push('No layer over a beach shirt');
  else if(layer&&layer.kind==='hoodie'&&(collar||top.kind==='jersey'))H.push('Hoodie over a '+(collar?'collared shirt':'jersey')+' looks off');
  if(layer&&layer.kind==='hoodie'&&top.heavy)H.push('Too bulky: hoodie over a heavy top');
  if(S.build==='lower'&&bottom.kind==='baggy'&&top.kind==='beach')H.push('Baggy jeans + a drapey shirt swallows your frame');
  const acc=ps.filter(p=>p.role==='accent');
  if(acc.length>1&&!acc.every(p=>fam(p,acc[0])))H.push('Two accents fighting: '+acc.map(p=>p.name).join(' + '));
  if(shoes.role==='accent'&&[top,layer,bottom].some(p=>p&&p.role!=='neutral'&&!fam(shoes,p)))H.push('Statement shoes need a quiet fit');

  /* colour roles */
  if(!acc.length)add(2,'Neutral base, nothing fighting');
  else if(acc.length===1)add(3.5,acc[0].name+(acc[0]===shoes?' is the statement, rest stays quiet':' is the one focal point'));
  else add(2,'Matching accents, tonal pop');
  const earth=ps.filter(p=>p.role==='earth');
  if(earth.length===1&&!acc.length)add(1,'Earth tone on a neutral base');

  /* weather: heavy pieces in the heat look sweaty, not intentional */
  if(D.temp==='warm'){
    if(top.heavy)add(-3,'Heavy top for the heat');
    if(layer)add(-1,'Layer in warm weather');
  }else if(top.heavy)add(1.5,'Heavy knit suits the cool');
  if(earth.length>1){const echo=earth.some((a,i)=>earth.slice(i+1).some(b=>fam(a,b)));echo?add(2,'Earth tones echo each other'):add(-2,'Two different earth tones')}
  if(acc.length&&earth.length&&!earth.some(e=>fam(e,acc[0])))add(-2,'Earth tone and accent compete');

  /* tonal contrast */
  if(tt==='dark'&&bt==='dark')top.role==='neutral'?add(2,'Dark on dark, tonal'):add(1,'Deep tones sit well together');
  else if(tt==='light'&&bt==='dark')add(2,'Light over dark contrast');
  else if(tt==='dark'&&bt==='light')add(2,'Dark top, washed denim contrast');
  else if(tt==='light'&&bt==='light')add(1,'All-light, clean');
  else if(tt==='mid'&&bt==='mid')add(-2,'Mid-tone on mid-tone, flat');
  else add(1,'Balanced tones');
  if(ps.every(p=>tone(p)==='dark'&&p.role==='neutral'))add(1.5,'Full dark fit, effortless');
  if((top.kind==='tee'||top.kind==='henley')&&shoes.kind==='sneaker'&&shoes.role==='neutral'&&!layer)add(1,'Easy staple, clean sneaker');

  /* silhouette */
  const hood=layer&&layer.kind==='hoodie';
  if(bottom.kind==='baggy'){
    if(top.heavy||hood)add(-3,'Volume on volume');
    else if(BASE.includes(top.kind)&&S.build!=='lower')add(2,'Relaxed leg, clean top');
  }else if(bottom.kind==='skinny'&&(top.heavy||hood))add(2,'Volume up top, slim leg');

  /* build: more mass below than above, so build the top half and quiet the legs */
  if(S.build==='lower'){
    if(bottom.kind==='baggy')add(-4,'Baggy denim adds width where you want less');
    if(bt==='dark')add(1,'Dark leg slims the lower half');
    else if(bt==='light')add(-1.5,'Light leg pulls the eye down');
    if(top.heavy)add(2,'Weight and texture build the upper frame');
    if(top.stripe)add(1.5,'Horizontal stripes widen the shoulder line');
    if(top.kind==='beach')add(-3,'Drapey shirt gives no structure up top');
    if(layer)add(2,'Layer builds a shoulder line');
    if(tt==='light'&&bt==='dark')add(1,'Bright top over a dark leg lifts the eye up');
  }

  /* shoes */
  if(shoes.kind==='loafer'){
    add(1.5,'Smart base: loafer with a collar');
    if(bt==='dark')add(1,'Sharp dark leg');
  }else{
    const st=tone(shoes);
    if(st==='light'&&bt==='dark')add(1,'Light shoe pops against a dark leg');
    if(st==='dark'&&bt==='dark')add(1,'Dark shoe grounds the fit');
    if(shoes.role==='neutral'&&st==='light'&&top.role==='earth')add(1,'Cream shoe warms the earth tones');
  }

  /* pattern */
  if(top.pat){
    if(top.kind!=='jersey')add(1,'Pattern up top, solid below');
    if(layer)add(-2,'Busy top under a layer');
    if(shoes.role==='accent'&&!fam(shoes,top))add(-4,'Busy top + loud shoes');
  }

  /* layers */
  if(layer){
    if(layer.kind==='jacket'){
      if(['shirt','polo','tee','henley'].includes(top.kind))add(1,'Jacket sharpens the look');
      if(top.heavy)add(-2,'Bulky layers');
    }
    if(tone(layer)==='dark'&&tt==='dark'&&layer.role==='neutral')add(1,'Tonal layering');
    if(layer.role==='neutral'&&top.role==='neutral'&&tone(layer)==='mid'&&tt==='mid')add(-3,'Grey on grey, no contrast');
  }

  /* beach */
  if(top.kind==='beach'){
    if(bottom.kind==='baggy'&&S.build!=='lower')add(2,'Vacation fit, relaxed all round');
    if(shoes.kind==='sneaker'&&shoes.role==='neutral')add(1,'Easy sneaker keeps it casual');
  }

  /* learned taste */
  let tz=0;pairKeys(ps).forEach(k=>{tz+=(S.taste[k]||0)});
  if(tz>0)add(tz*2.5,'Matches your fire picks');
  else if(tz<0)add(tz*2.5,'Close to something you noped');

  return {raw,R,H};
}
const score10=raw=>Math.max(0,Math.min(10,(raw+3)/14*10));
function getFit(){
  const g=k=>D.sel[k]?item(D.sel[k]):null;
  const f={top:g('top'),layer:g('layer'),bottom:g('bottom'),shoes:g('shoes')};
  return (f.top&&f.bottom&&f.shoes)?f:null;
}

/* ---------- warnings ---------- */
function warnings(){
  const w=[],sel=D.sel,date=D.date;
  const its=CATS.map(c=>sel[c[0]]).filter(Boolean).map(item);
  if(!its.length)return w;
  its.forEach(it=>{
    const d=daysSince(it.id,date);
    if(d!==null&&d<=S.settings.rest[it.cat])w.push({t:'bad',m:`${it.name} was worn ${ago(d)} (rest rule: ${S.settings.rest[it.cat]}d)`});
  });
  const pd=lastPairDays(sel.top,sel.bottom,date);
  if(pd!==null&&pd<=S.settings.combo)w.push({t:'bad',m:`Same top + bottom pair ${ago(pd)}`});
  const cd=lastComboDays(its.map(i=>i.id),date);
  if(cd!==null&&cd<=S.settings.combo)w.push({t:'bad',m:`Exact same fit ${ago(cd)}`});
  const f=getFit();
  if(f){scoreFit(f).H.forEach(m=>w.push({t:'warn',m}))}
  if(f&&!w.length)w.push({t:'ok',m:'Clean. No repeats, nothing off.'});
  return w;
}

/* ---------- suggest: score every legal fit, pick from the best ---------- */
function pool(cat,date,filter){
  let all=S.items.filter(i=>i.cat===cat&&i.owned&&(!filter||filter(i)));
  const ok=all.filter(i=>!blocked(i,date));
  if(ok.length)return ok;
  all=all.sort((a,b)=>{const da=daysSince(a.id,date),db=daysSince(b.id,date);return (db===null?999:db)-(da===null?999:da)});
  return all.slice(0,3);
}
function suggest(){
  const date=D.date,LB=logsBefore(date);
  const recent=LB.filter(l=>diff(date,l.date)<=S.settings.combo);
  const ds={};S.items.forEach(i=>{const l=LB.find(x=>x.items.includes(i.id));ds[i.id]=l?diff(date,l.date):null});
  const rot=(it,w)=>w*Math.min(ds[it.id]===null?30:ds[it.id],30)/30;
  const vf=i=>D.vibe==='any'||i.vibes.includes(D.vibe);
  const tops=pool('top',date,vf),bottomsAll=pool('bottom',date),shoesAll=pool('shoes',date);
  const cands=[];
  tops.forEach(t=>{
    const common=i=>i.vibes.some(v=>t.vibes.includes(v));
    const bs=bottomsAll.filter(common),ss=shoesAll.filter(common);
    const ls=D.layer==='on'?pool('layer',date,common):[null];
    bs.forEach(b=>{
      if(recent.some(l=>l.items.includes(t.id)&&l.items.includes(b.id)))return;
      ss.forEach(s=>ls.forEach(l=>{
        const ids=[t,l,b,s].filter(Boolean).map(x=>x.id);
        if(recent.some(r=>r.items.length===ids.length&&ids.every(i=>r.items.includes(i))))return;
        const r=scoreFit({top:t,layer:l,bottom:b,shoes:s});
        if(r.H.length)return;
        const sc=r.raw+rot(t,1.2)+rot(b,.8)+rot(s,.8)+(l?rot(l,.3):0);
        cands.push({sel:{top:t.id,layer:l?l.id:null,bottom:b.id,shoes:s.id},sc,key:ids.join('|')});
      }));
    });
  });
  if(!cands.length){toast('No legal fit with these rules. Loosen Settings or change vibe.');return}
  cands.sort((a,b)=>b.sc-a.sc);
  let fresh=cands.filter(c=>!D.seen.has(c.key));
  if(!fresh.length){D.seen=new Set();fresh=cands}
  // best fit per top, keep the ones within reach of the best, pick a style bucket at random, then a score-weighted draw inside it
  const seenTop=new Set(),per=[];
  for(const c of fresh){if(!seenTop.has(c.sel.top)){seenTop.add(c.sel.top);per.push(c)}}
  const ok=per.filter(c=>c.sc>=per[0].sc-5);
  const buckets={};ok.forEach(c=>{const k=item(c.sel.top).kind;(buckets[k]=buckets[k]||[]).push(c)});
  const ks=Object.keys(buckets),grp=buckets[ks[Math.floor(Math.random()*ks.length)]].slice(0,6);
  const ws=grp.map(c=>Math.exp((c.sc-grp[0].sc)/2));
  let r=Math.random()*ws.reduce((a,b)=>a+b,0),pick=grp[grp.length-1];
  for(let i=0;i<grp.length;i++){r-=ws[i];if(r<=0){pick=grp[i];break}}
  D.seen.add(pick.key);D.sel=pick.sel;render();
}
function taste(delta,fit){
  const f=fit||getFit();if(!f)return;
  pairKeys([f.top,f.layer,f.bottom,f.shoes].filter(Boolean)).forEach(k=>{S.taste[k]=Math.max(-3,Math.min(3,(S.taste[k]||0)+delta))});
  save();
}

const KEYK='dripdawg.apikey',GKEYK='dripdawg.gkey',MODK='dripdawg.model',GMODK='dripdawg.gmodel',PROVK='dripdawg.provider';

const ST={busy:false,err:'',looks:[],crit:null,occ:'',msg:''};
const SYS=`You are the personal stylist for Aakash, 23, based in Chennai (hot and humid most of the year). You think like a red-carpet designer: every look has ONE idea, a deliberate silhouette, one focal point, and a reason it works on this specific body. But it has to be wearable on an ordinary day and built ONLY from his wardrobe, using exact item ids. Never invent items.

His build: the message carries body measurements and notes. Default read: narrower, lighter upper body and a heavier, stronger lower half. Dress the proportion. Build the upper half visually with structure, texture, weight, horizontal stripes, brighter or lighter tops over darker legs, and layers that add a shoulder line when the weather allows. Keep the legs dark, clean and not baggy. Never pair a drapey, light-fabric, boxy top (beach shirts) with baggy jeans. Explain the proportion logic in terms of his body, not generic praise.

Hard rules: exactly one top, one bottom, one pair of shoes, and at most one layer (only when layer_allowed is true). Loafers only with a shirt or polo, never with baggy jeans or a hoodie. No hoodie over a collared shirt or jersey. No layer over a beach shirt. One focal point: at most one accent-role piece (or a matching accent family); accent-role shoes need an otherwise neutral fit. Respect rest rules: never use a piece whose days_since_worn is less than or equal to its category rest days, and never repeat a top+bottom pair worn within no_repeat_pair_days. When it does not hurt the look, favour pieces with a high days_since_worn and say when you are rescuing a neglected piece. Honour taste_memory (positive = he fired it, negative = he noped it), the occasion, the weather, and the vibe_filter.

Be specific and brief. Return ONLY one JSON object, no prose around it.`;

async function callClaude(messages){
  const key=getKey();if(!key)throw new Error('nokey');
  let raw='';
  if(getProv()==='gemini'){
    const gbody=JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:messages.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]})),generationConfig:{responseMimeType:'application/json',maxOutputTokens:2500}});
    const gurl='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(getModel())+':generateContent';
    // new AQ. keys use the x-goog-api-key header; old AIza keys also work with ?key=, so fall back to that
    let r=await fetch(gurl,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},body:gbody});
    if(!r.ok&&[400,401,403].includes(r.status)){
      const r2=await fetch(gurl+'?key='+encodeURIComponent(key),{method:'POST',headers:{'content-type':'application/json'},body:gbody}).catch(()=>null);
      if(r2&&r2.ok)r=r2;
    }
    if(!r.ok){let t='';try{t=(await r.json()).error.message}catch(e){}
      throw new Error(r.status===429?'Free limit hit for now. Try again in a minute, or tomorrow.':(/api key/i.test(t)?'Gemini key rejected. Check it in Settings.':(t||('HTTP '+r.status))))}
    const j=await r.json();
    raw=(((j.candidates||[])[0]||{}).content||{parts:[]}).parts.map(p=>p.text||'').join('');
  }else{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:getModel(),max_tokens:2000,system:SYS,messages})});
    if(!r.ok){let t='';try{t=(await r.json()).error.message}catch(e){}throw new Error(r.status===401?'API key rejected. Check it in Settings.':(t||('HTTP '+r.status)))}
    const j=await r.json();raw=(j.content||[]).map(c=>c.text||'').join('');
  }
  const a=raw.indexOf('{'),b=raw.lastIndexOf('}');
  if(a<0||b<a)throw new Error('The stylist replied without a usable answer. Try again.');
  return {raw,data:JSON.parse(raw.slice(a,b+1))};
}
function payload(mode,extra){
  const date=D.date,LB=logsBefore(date);
  const ds=id=>{const l=LB.find(x=>x.items.includes(id));return l?diff(date,l.date):null};
  const nm=id=>{const i=item(id);return i?i.name:'?'};
  const items=S.items.filter(i=>i.owned).map(i=>({id:i.id,name:i.name,cat:i.cat,type:i.kind,role:i.role,tone:tone(i),hex:i.color,heavy:i.heavy,pattern:i.pat,stripe:!!i.stripe,vibes:i.vibes,days_since_worn:ds(i.id)}));
  const last=LB.slice(0,10).map(l=>({days_ago:diff(date,l.date),items:l.items.map(nm)}));
  const taste=Object.keys(S.taste).filter(k=>S.taste[k]).map(k=>({pair:k.split('|').map(nm),score:S.taste[k]}));
  return JSON.stringify(Object.assign({mode,date,weather:D.temp==='warm'?'hot and humid':'cool',vibe_filter:D.vibe,layer_allowed:D.layer==='on',body:Object.assign({build:S.build},S.profile),rest_days:S.settings.rest,no_repeat_pair_days:S.settings.combo,items,last_logs:last,taste_memory:taste},extra));
}
function legal(l){
  const g=(id,cat)=>{const i=id&&item(id);return (i&&i.owned&&i.cat===cat)?i:null};
  const top=g(l.top,'top'),bottom=g(l.bottom,'bottom'),shoes=g(l.shoes,'shoes');
  if(!top||!bottom||!shoes)return 'unknown or wrong-category id';
  let layer=null;
  if(l.layer){layer=g(l.layer,'layer');if(!layer)return 'bad layer id';if(D.layer!=='on')return 'layer not allowed today'}
  const fit={top,layer,bottom,shoes},r=scoreFit(fit);
  if(r.H.length)return r.H[0];
  for(const it of [top,layer,bottom,shoes]){if(it&&blocked(it,D.date))return it.name+' is still resting'}
  const pd=lastPairDays(top.id,bottom.id,D.date);
  if(pd!==null&&pd<=S.settings.combo)return 'top+bottom pair worn '+pd+'d ago';
  return {fit,r};
}
async function styleMe(){

async function critique(){
  const f=getFit();if(!f){toast('Pick top, bottom and shoes first');return}

    const extra={occasion:ST.occ||'no specific occasion',current_fit:cur,
      task:'Critique the current fit like a designer. Be blunt about what works and what does not for his build. Propose the smallest swap that fixes it, or null swaps if it already works. Swap ids must obey every rule.',
      reply_json_shape:'{"verdict":"one punchy sentence","works":["..."],"fix":["..."],"swap":{"top":"id or null","layer":"id or null","bottom":"id or null","shoes":"id or null"}}'};
    const {data}=await callClaude([{role:'user',content:payload('critique',extra)}]);

  }).join('');
  return `
  <div class="two" style="margin-top:8px">
    <div class="card"><div class="mut">Fits logged</div><div class="big">${S.logs.length}</div></div>
    <div class="card"><div class="mut">Streak</div><div class="big">${streak()}d</div></div>
  </div>
  <h3>Rotation</h3><div class="card">${catRows}</div>
  <h3>Most worn</h3><div class="card">${counts.filter(c=>c.n>0).slice(0,8).map(c=>`<div style="margin:8px 0"><div class="row"><span class="dot" style="background:${c.i.color};width:14px;height:14px"></span><div class="sp nm">${esc(c.i.name)}</div><div class="mut">${c.n}x</div></div><div class="bar"><i style="width:${Math.round(c.n/mx*100)}%"></i></div></div>`).join('')||'<div class="mut">Nothing yet.</div>'}</div>
  <h3>Dusty (14+ days or never)</h3>
  <div class="card">${S.logs.length<7?'<div class="mut">Log a week of fits and this fills up with what you are ignoring.</div>':(dusty.length?dusty.map(i=>`<div class="li"><span class="dot" style="background:${i.color};width:14px;height:14px"></span><div class="sp nm">${esc(i.name)}</div><div class="mut">${ago(daysSince(i.id,tmr))}</div></div>`).join(''):'<div class="mut">Everything is in rotation.</div>')}</div>`;
}
function vSettings(){
  const r=S.settings.rest;
  return `
  <div class="card"><label class="f" style="margin-top:0">Same fit / same top+bottom pair: no repeat within (days)</label><input type="number" min="0" max="60" data-s="combo" value="${S.settings.combo}">
  <label class="f">Item rest, days before it can be worn again</label>
  <div class="two">${CATS.map(c=>`<div><div class="mut">${c[1]}</div><input type="number" min="0" max="30" data-s="rest:${c[0]}" value="${r[c[0]]}"></div>`).join('')}</div></div>
  <h3>Your build</h3>
  <div class="card"><label class="f" style="margin-top:0">Proportions</label>
  <select data-b="build"><option value="lower" ${S.build==='lower'?'selected':''}>Heavier lower half, narrower top</option><option value="balanced" ${S.build==='balanced'?'selected':''}>Balanced</option><option value="upper" ${S.build==='upper'?'selected':''}>Heavier upper half</option></select>
  <div class="two">${[['height','Height (cm)'],['weight','Weight (kg)'],['shoulder','Shoulders (in)'],['chest','Chest (in)'],['waist','Waist (in)'],['thigh','Thigh (in)']].map(f=>`<div><label class="f">${f[1]}</label><input type="text" inputmode="decimal" data-p="${f[0]}" value="${esc(S.profile[f[0]])}"></div>`).join('')}</div>
  <label class="f">Notes for the stylist</label><input type="text" data-p="notes" value="${esc(S.profile.notes)}">
  <div class="mut" style="margin-top:8px">The scoring engine and the stylist both use this. Add real measurements and the advice gets sharper.</div></div>
  <h3>AI stylist</h3>
  <div class="card"><label class="f" style="margin-top:0">Provider</label>
  <select id="prov"><option value="gemini" ${getProv()==='gemini'?'selected':''}>Google Gemini (free tier)</option><option value="claude" ${getProv()==='claude'?'selected':''}>Claude (paid API)</option></select>
  <label class="f">${getProv()==='gemini'?'Google AI Studio key':'Anthropic API key'}</label><input type="text" id="apikey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${getProv()==='gemini'?'AQ... or AIza...':'sk-ant-...'}" value="${esc(getKey())}">
  <label class="f">Model</label>
  ${getProv()==='gemini'?`<input type="text" id="gmodel" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(getModel())}">`:`<select id="model"><option value="claude-sonnet-5-5" ${getModel()==='claude-sonnet-5-5'?'selected':''}>Sonnet 5.5 (fast, cheap)</option><option value="claude-opus-5-5" ${getModel()==='claude-opus-5-5'?'selected':''}>Opus 5.5 (sharper taste, slower)</option></select>`}
  <div class="mut" style="margin-top:8px">${getProv()==='gemini'?'Free at aistudio.google.com, no card. Free-tier prompts can be used by Google for training, so your wardrobe and build notes leave the phone.':'Billed per use by Anthropic. Put a low monthly spend limit on the key.'} Keys stay on this device and never go into backups.</div><button class="btn ghost sm" style="margin-top:10px" data-a="testkey">Test key</button><div id="keystatus" class="mut" style="margin-top:8px"></div></div>
  <h3>Taste memory</h3>
  <div class="card"><div class="mut">${Object.keys(S.taste).filter(k=>S.taste[k]).length} piece pairings remembered from your Fire and Nope taps.</div><button class="btn ghost sm" style="margin-top:8px" data-a="resettaste">Forget taste</button></div>
  <h3>Data</h3>
  <div class="two"><button class="btn ghost" data-a="export">Export backup</button><button class="btn ghost" data-a="import">Import backup</button></div>
  <button class="btn danger" style="margin-top:8px" data-a="reset">Reset everything</button>
  <div class="mut" style="margin-top:14px">Data lives in this browser only. Export a backup now and then.</div>`;
}

const TABS=[['today','Today'],['stylist','Stylist'],['wardrobe','Wardrobe'],['history','History'],['stats','Stats'],['settings','Settings']];
function render(){
  $('#nav').innerHTML=TABS.map(t=>`<button class="${view===t[0]?'on':''}" data-a="tab" data-t="${t[0]}">${t[1]}</button>`).join('');
  $('#hs').textContent=nice(todayS());
  $('#app').innerHTML={today:vToday,stylist:vStylist,wardrobe:vWardrobe,history:vHistory,stats:vStats,settings:vSettings}[view]();
}

/* ---------- sheets ---------- */
function openSheet(html){$('#shin').innerHTML=html;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}
function pickSheet(cat){
  const label=CATS.find(c=>c[0]===cat)[1];
  const arr=S.items.filter(i=>i.cat===cat&&i.owned).map(i=>({i,d:daysSince(i.id,D.date)}))
    .sort((a,b)=>(b.d===null?999:b.d)-(a.d===null?999:a.d));
  openSheet(`<div class="row"><h3 style="margin:0" class="sp">Pick ${label}</h3><button class="chip" data-a="close">Close</button></div>
  ${cat==='layer'?'<div class="li" data-a="choose" data-cat="layer" data-id=""><div class="sp nm">None</div></div>':''}
  ${arr.map(x=>{const bad=x.d!==null&&x.d<=S.settings.rest[cat];return `<div class="li" data-a="choose" data-cat="${cat}" data-id="${x.i.id}"><span class="dot" style="background:${x.i.color}"></span><div class="sp"><div class="nm">${esc(x.i.name)}</div><div class="mut">${ago(x.d)}</div></div>${bad?'<span class="tag bad">too soon</span>':'<span class="tag ok">ready</span>'}</div>`}).join('')}`);
}
const kindOpts=(cat,sel)=>KINDS[cat].map(k=>`<option value="${k}" ${sel===k?'selected':''}>${k}</option>`).join('');
function editSheet(id){
  const it=id?item(id):{name:'',cat:'top',color:'#444444',vibes:['casual'],owned:true,role:'auto',kind:'tee',heavy:false,pat:false};
  openSheet(`<div class="row"><h3 style="margin:0" class="sp">${id?'Edit item':'Add item'}</h3><button class="chip" data-a="close">Close</button></div>
  <label class="f">Name</label><input type="text" id="e_name" value="${esc(it.name)}">
  <label class="f">Category</label><select id="e_cat">${CATS.map(c=>`<option value="${c[0]}" ${it.cat===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select>
  <label class="f">Colour</label><input type="color" id="e_col" value="${it.color}">
  <div class="two"><div><label class="f">Colour role</label><select id="e_role">${['auto','neutral','earth','accent'].map(r=>`<option value="${r}" ${it.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
  <div><label class="f">Type</label><select id="e_kind">${kindOpts(it.cat,it.kind)}</select></div></div>
  <div class="chips"><label class="chip"><input type="checkbox" id="e_heavy" ${it.heavy?'checked':''}> heavy / bulky</label><label class="chip"><input type="checkbox" id="e_pat" ${it.pat?'checked':''}> pattern / graphic</label></div>
  <label class="f">Vibe (used by Suggest)</label>
  <div class="chips">${VIBES.map(v=>`<label class="chip"><input type="checkbox" class="e_v" value="${v}" ${it.vibes.includes(v)?'checked':''}> ${v}</label>`).join('')}</div>
  <label class="chip" style="display:inline-block;margin-top:6px"><input type="checkbox" id="e_own" ${it.owned?'checked':''}> I own this</label>
  <div class="mut" style="margin-top:8px">Neutral = black, white, grey, navy, denim. Earth = olive, brown, maroon, cream, sage. Accent = anything loud.</div>
  <div class="two" style="margin-top:14px"><button class="btn" data-a="saveitem" data-id="${id||''}">Save</button>${id?`<button class="btn danger" data-a="delitem" data-id="${id}">Delete</button>`:'<span></span>'}</div>`);
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- actions ---------- */
const A={
  tab(d){view=d.t;render();scrollTo(0,0)},
  close(){closeSheet()},
  dshift(d){const [y,m,dd]=D.date.split('-').map(Number);const x=new Date(y,m-1,dd+Number(d.n));D.date=ymd(x);loadDraft();render()},
  vibe(d){D.vibe=d.v;D.seen=new Set();render()},
  layermode(){D.layer=D.layer==='on'?'off':'on';D.seen=new Set();render()},
  tempmode(){D.temp=D.temp==='warm'?'cool':'warm';D.seen=new Set();render()},
  style(){styleMe()},
  async testkey(){
    const el=$('#keystatus');if(!el)return;
    if(!getKey()){el.style.color='var(--bad)';el.textContent='Paste a key first.';return}
    el.style.color='';el.textContent='Testing...';
    try{await callClaude([{role:'user',content:'Reply with only this JSON: {"ok":true}'}]);el.style.color='var(--ok)';el.textContent='Key works. '+getProv()+' / '+getModel()}
    catch(e){el.style.color='var(--bad)';el.textContent='Failed: '+e.message}
  },
  critique(){critique()},
  wear(d){const x=ST.looks[Number(d.i)];if(!x)return;const f=x.fit;D.sel={top:f.top.id,layer:f.layer?f.layer.id:null,bottom:f.bottom.id,shoes:f.shoes.id};view='today';render();scrollTo(0,0)},
  nopelook(d){const i=Number(d.i),x=ST.looks[i];if(!x)return;taste(-1,x.fit);ST.looks.splice(i,1);render();toast('Noted. Not that.')},
  applyswap(){const s=ST.crit&&ST.crit.swapFit;if(!s)return;const f=s.fit;D.sel={top:f.top.id,layer:f.layer?f.layer.id:null,bottom:f.bottom.id,shoes:f.shoes.id};view='today';render();scrollTo(0,0)},
  suggest(){suggest()},
  nope(){taste(-1);suggest()},
  fire(){taste(1);toast('Noted. More like this.')},
  resettaste(){S.taste={};save();render();toast('Taste wiped')},
  pick(d){pickSheet(d.cat)},
  choose(d){D.sel[d.cat]=d.id||null;closeSheet();render()},
  log(){
    const ids=CATS.map(c=>D.sel[c[0]]).filter(Boolean);
    if(!ids.length){toast('Pick something first');return}
    if(!D.sel.top||!D.sel.bottom||!D.sel.shoes){if(!confirm('Missing a top, bottom or shoes. Log anyway?'))return}
    const w=warnings().filter(x=>x.t==='bad');
    if(w.length&&!confirm('Repeat alert:\n- '+w.map(x=>x.m).join('\n- ')+'\n\nLog anyway?'))return;
    S.logs=S.logs.filter(l=>l.date!==D.date);S.logs.push({date:D.date,items:ids});save();toast('Logged');render();
  },
  clear(){
    const has=S.logs.find(l=>l.date===D.date);
    if(has){S.logs=S.logs.filter(l=>l.date!==D.date);save();}
    D.sel={top:null,layer:null,bottom:null,shoes:null};render();
  },
  wcat(d){W.cat=d.c;render()},
  add(){editSheet(null)},
  edit(d){editSheet(d.id)},
  saveitem(d){
    const name=$('#e_name').value.trim();if(!name){toast('Name it');return}
    const vibes=[...document.querySelectorAll('.e_v:checked')].map(x=>x.value);
    const cat=$('#e_cat').value,color=$('#e_col').value;
    let role=$('#e_role').value;if(role==='auto')role=autoRole(color,cat);
    const obj={name,cat,color,role,kind:$('#e_kind').value,heavy:$('#e_heavy').checked,pat:$('#e_pat').checked,vibes:vibes.length?vibes:['casual'],owned:$('#e_own').checked};
    if(d.id){Object.assign(item(d.id),obj)}else S.items.push(Object.assign({id:uid()},obj));
    save();closeSheet();render();
  },
  delitem(d){
    if(!confirm('Delete this item? It also leaves old logs.'))return;
    S.items=S.items.filter(i=>i.id!==d.id);
    S.logs.forEach(l=>l.items=l.items.filter(x=>x!==d.id));
    S.logs=S.logs.filter(l=>l.items.length);
    Object.keys(D.sel).forEach(k=>{if(D.sel[k]===d.id)D.sel[k]=null});
    save();closeSheet();render();
  },
  editlog(d){D.date=d.d;loadDraft();view='today';render();scrollTo(0,0)},
  dellog(d){if(!confirm('Delete this log?'))return;S.logs=S.logs.filter(l=>l.date!==d.d);save();loadDraft();render()},
  export(){
    const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dripdawg-backup-'+todayS()+'.json';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  },
  import(){$('#imp').click()},
  reset(){if(!confirm('Wipe everything and restore the starting wardrobe?'))return;S=DEF();save();loadDraft();render();toast('Reset')}
};
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const t=e.target.closest('[data-a]');if(!t)return;
  const f=A[t.dataset.a];if(f)f(t.dataset);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='wq'){W.q=t.value;$('#wlist').innerHTML=wlistHTML()}
  if(t.id==='occ')ST.occ=t.value;
  if(t.id==='apikey')lset(getProv()==='gemini'?GKEYK:KEYK,t.value.trim());
  if(t.id==='gmodel')lset(GMODK,t.value.trim());
  if(t.dataset&&t.dataset.p){S.profile[t.dataset.p]=t.value;save()}
  if(t.dataset&&t.dataset.s){
    const v=Math.max(0,parseInt(t.value,10)||0);
    if(t.dataset.s==='combo')S.settings.combo=v;
    else S.settings.rest[t.dataset.s.split(':')[1]]=v;
    save();
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='dpick'&&e.target.value){D.date=e.target.value;loadDraft();render()}
  if(e.target.id==='e_cat'){$('#e_kind').innerHTML=kindOpts(e.target.value,'')}
  if(e.target.id==='model')lset(MODK,e.target.value);
  if(e.target.id==='prov'){lset(PROVK,e.target.value);render()}
  if(e.target.dataset&&e.target.dataset.b){S.build=e.target.value;D.seen=new Set();save();toast('Build updated')}
  if(e.target.id==='imp'){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.items||!j.logs||!j.settings)throw 0;if(!confirm('Replace current data with this backup?'))return;S=fix(j);save();loadDraft();render();toast('Imported')}catch(x){toast('Not a valid backup')}};
    r.readAsText(f);e.target.value='';
  }
});
render();
})();
</script>
</body>
</html>
